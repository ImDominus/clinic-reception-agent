[project]
name = "clinic-reception-agent"
version = "0.0.1"
description = "의원 접수·예약 전화 응대 에이전트"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: 실제 Postgres가 있어야 돌아가는 테스트 (동시성·제약조건)",
]

[tool.ruff]
line-length = 100
